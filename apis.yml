aid: earnin
name: Earnin
description: >-
  Earnin (formerly Activehours) is a consumer financial technology company offering earned
  wage access (EWA) that lets workers tap the pay they have already earned before their
  scheduled payday. Its mobile app products include Cash Out (access earned wages up to
  $150/day and $1,000/pay period with no mandatory fees), Live Pay and the EarnIn Card,
  Early Pay, Balance Shield overdraft protection, credit monitoring, FDIC-insured Savings
  Jars, and an EarnIn Payroll offering for businesses. Earnin is a consumer app rather than
  an API platform; it publishes no public developer portal or API, but does operate a
  vulnerability-disclosure program (security.txt via Inspectiv) and a trust center. It was
  surfaced as a portfolio company of a16z, Felicis, Matrix Partners, Ribbit Capital, and
  Trinity Ventures and profiled in the API Evangelist network.
